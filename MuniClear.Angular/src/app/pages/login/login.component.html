<div class="login-wrap">

  <div class="login-card">

    <!-- Logo / brand -->
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="22" height="22">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">MuniClear</div>
        <div class="brand-sub">uMhlathuze Municipal Services</div>
      </div>
    </div>

    <!-- Session expired notice -->
    <div class="info-banner" *ngIf="expired">
      Your session has expired. Please log in again.
    </div>

    <!-- Error -->
    <div class="error-banner" *ngIf="error">{{ error }}</div>

    <!-- Form -->
    <div class="form-group">
      <label class="form-label">Email address</label>
      <input
        type="email"
        class="form-input"
        [(ngModel)]="email"
        placeholder="your@email.com"
        (keyup.enter)="login()"
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <label class="form-label">SA ID number</label>
      <input
        type="password"
        class="form-input"
        [(ngModel)]="idNumber"
        placeholder="13-digit ID number"
        (keyup.enter)="login()"
        autocomplete="current-password"
        maxlength="13"
      />
    </div>

    <button class="btn-primary" (click)="login()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign in' }}
    </button>

    <!-- Divider -->
    <div class="divider"><span>or</span></div>

    <!-- Demo button — for portfolio reviewers -->
    <button class="btn-demo" (click)="demoLogin()" [disabled]="demoLoading">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/>
      </svg>
      {{ demoLoading ? 'Loading demo...' : 'Try demo — no login needed' }}
    </button>

    <div class="portfolio-note">
      Portfolio project by <strong>Manelisi</strong> ·
      <a href="https://github.com" target="_blank">GitHub</a>
    </div>

  </div>

</div>
