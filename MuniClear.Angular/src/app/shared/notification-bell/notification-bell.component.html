<div class="bell-wrap">
  <button class="bell-btn" (click)="toggle()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
  </button>

  <div class="dropdown" *ngIf="open">
    <div class="dropdown-header">
      <span>Notifications</span>
      <span class="notif-count" *ngIf="notifications.length > 0">{{ notifications.length }}</span>
    </div>
    <div class="notif-list">
      <div class="notif-item" *ngFor="let n of notifications"
        [style.background]="!n.isRead ? typeStyle(n.type).bg : ''"
        [style.border-left-color]="typeStyle(n.type).color">
        <div class="notif-title" [style.color]="typeStyle(n.type).color">{{ n.title }}</div>
        <div class="notif-msg">{{ n.message }}</div>
        <div class="notif-date">{{ formatDate(n.createdAt) }}</div>
      </div>
      <div class="notif-empty" *ngIf="notifications.length === 0">No notifications</div>
    </div>
  </div>
</div>
